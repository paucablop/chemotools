pre-commit:
  parallel: true
  commands:
    lint:
      run: task lint-fix
      glob: "**/*.py"
    format-check:
      run: task format
      glob: "**/*.py"
    typos:
      run: task spelling ./chemotools


commit-msg:
  commands:
    commit-msg-check:
      run: uv run commitlint --file {1}


