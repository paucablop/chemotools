groups:
  baseline:
    description: Baseline correction transformers

estimators:
  - key: baseline.air_pls
    group: baseline
    class_path: chemotools.baseline.AirPls
    constructor_defaults:
      lam: 10000.0
      nr_iterations: 100
      solver_type: banded
      max_iter_after_warmstart: 20
      n_jobs: -1
    fit_strategy:
      adapter: plain_fit
      fit_input: X_fit
      fit_kwargs: {}
    transform_strategy:
      adapter: plain_transform
      transform_input: X_transform
      transform_kwargs: {}
    scenario_default: standard
    profile_defaults:
      sort: cumulative
      top: 25
    compare_policy:
      max_p95_regression_percent: 2.0
      require_median_improvement: true

  - key: baseline.ar_pls
