    constructor_defaults:
      scale: 0.05
      random_state: 42
    fit_strategy:
      adapter: plain_fit
      fit_input: X_fit
      fit_kwargs: {}
    transform_strategy:
      adapter: plain_transform
      transform_input: X_transform
      transform_kwargs: {}
    scenario_default: standard
    profile_defaults:
      sort: cumulative
      top: 25
    compare_policy:
      max_p95_regression_percent: 2.0
      require_median_improvement: true